<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYPHER 威胁感知中心</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
      --panel: rgba(255, 255, 255, 0.08);
      --panel-soft: rgba(255, 255, 255, 0.05);
      --line: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --accent: #00d4ff;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
      --glass-blur: blur(20px);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
      --glow-accent: 0 0 20px rgba(0, 212, 255, 0.4);
      --glow-ok: 0 0 20px rgba(52, 211, 153, 0.4);
      --glow-warn: 0 0 20px rgba(251, 191, 36, 0.4);
      --glow-danger: 0 0 20px rgba(248, 113, 113, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    header {
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 3;
      box-shadow: var(--shadow-sm);
    }
    .brand { 
      font-weight: 700; 
      font-size: 18px;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: var(--glow-accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    .brand span { 
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    nav { display: flex; gap: 12px; flex-wrap: wrap; }
    nav a, nav button {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 14px;
    }
    nav a:hover, nav button:hover { 
      border-color: var(--accent);
      background: rgba(0, 212, 255, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
    }
    nav a.active, nav button.active {
      border-color: var(--accent);
      background: rgba(0, 212, 255, 0.15);
      box-shadow: var(--glow-accent);
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 20px;
      padding: 24px;
    }
    .panel {
      background: var(--panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .panel:hover {
      box-shadow: var(--shadow-lg);
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }
    .video-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      overflow: hidden;
    }
    .video-wrap img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      background: rgba(0, 0, 0, 0.3);
    }
    .detection-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .detection-box {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid var(--box-color, #ef4444);
      border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45), 0 0 18px rgba(239, 68, 68, 0.35);
    }
    .detection-label {
      position: absolute;
      left: -2px;
      top: -28px;
      max-width: calc(100% + 4px);
      padding: 4px 8px;
      border-radius: 6px 6px 6px 0;
      background: var(--box-color, #ef4444);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
    }
    .detection-box.inside-label .detection-label {
      top: 0;
      border-radius: 3px 0 6px 0;
    }
    .video-label {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }
    .camera-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      padding: 16px;
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
    }
    button.active, button:hover { 
      border-color: var(--accent);
      background: rgba(0, 212, 255, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 212, 255, 0.25);
    }
    .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      background: var(--muted);
      box-shadow: 0 0 8px currentColor;
      transition: all 0.3s ease;
    }
    .dot.ok { 
      background: var(--ok);
      box-shadow: var(--glow-ok);
      animation: pulse-ok 2s ease-in-out infinite;
    }
    @keyframes pulse-ok {
      0%, 100% { box-shadow: 0 0 8px var(--ok); }
      50% { box-shadow: 0 0 16px var(--ok), 0 0 24px var(--ok); }
    }
    .dot.warn { 
      background: var(--warn);
      box-shadow: var(--glow-warn);
      animation: pulse-warn 1.5s ease-in-out infinite;
    }
    @keyframes pulse-warn {
      0%, 100% { box-shadow: 0 0 8px var(--warn); }
      50% { box-shadow: 0 0 16px var(--warn), 0 0 24px var(--warn); }
    }
    .feed { 
      padding: 16px; 
      display: grid; 
      gap: 12px; 
      max-height: calc(100vh - 160px); 
      overflow: auto;
    }
    .analysis-panel {
      border-top: 1px solid var(--line);
      padding: 18px 20px;
      display: grid;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    .analysis-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .analysis-content {
      min-height: 120px;
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 16px;
      line-height: 1.9;
      font-size: 14px;
      letter-spacing: 0.2px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .analysis-content::-webkit-scrollbar { width: 6px; }
    .analysis-content::-webkit-scrollbar-track { background: transparent; }
    .analysis-content::-webkit-scrollbar-thumb { 
      background: rgba(255, 255, 255, 0.15); 
      border-radius: 3px;
    }
    .analysis-content::-webkit-scrollbar-thumb:hover { 
      background: rgba(255, 255, 255, 0.25); 
    }
    .analysis-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .analysis-tag {
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 4px 10px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .alert-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px;
      display: grid;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .alert-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transition: left 0.5s ease;
    }
    .alert-card:hover::before {
      left: 100%;
    }
    .alert-card:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-sm);
    }
    .alert-card.critical { 
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(248, 113, 113, 0.08);
      animation: slideIn-critical 0.4s ease-out;
    }
    @keyframes slideIn-critical {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .alert-card.warning { 
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.08);
      animation: slideIn-warning 0.4s ease-out;
    }
    @keyframes slideIn-warning {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .alert-card.info { 
      border-color: rgba(0, 212, 255, 0.4);
      background: rgba(0, 212, 255, 0.06);
      animation: slideIn-info 0.4s ease-out;
    }
    @keyframes slideIn-info {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .alert-top { display: flex; justify-content: space-between; gap: 10px; }
    .title { font-weight: 700; }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .badge { 
      font-size: 12px; 
      border-radius: 99px; 
      padding: 4px 10px; 
      border: 1px solid var(--line);
      font-weight: 600;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }
    .critical .badge { 
      color: var(--danger);
      background: rgba(248, 113, 113, 0.15);
    }
    .warning .badge { 
      color: var(--warn);
      background: rgba(251, 191, 36, 0.15);
    }
    .info .badge { 
      color: var(--accent);
      background: rgba(0, 212, 255, 0.12);
    }
    .empty { 
      color: var(--muted); 
      text-align: center; 
      padding: 48px 16px;
      font-size: 14px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-backdrop[hidden] { display: none; }
    .skill-modal {
      width: min(900px, 100%);
      max-height: min(800px, calc(100vh - 48px));
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--line);
      border-radius: 20px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-head, .modal-actions {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
    }
    .modal-actions {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }
    .skill-tabs {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
    }
    .skill-tab {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }
    .skill-tab[aria-selected="true"] { 
      border-color: var(--accent);
      background: rgba(0, 212, 255, 0.12);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
    }
    .skill-modal-body {
      overflow: auto;
      padding: 18px 20px;
      display: grid;
      gap: 12px;
    }
    .skill-row {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: var(--panel-soft);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      gap: 10px;
      transition: all 0.3s ease;
    }
    .skill-row:hover {
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: var(--shadow-sm);
    }
    .skill-row-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .skill-row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .safety-note {
      border: 1px solid rgba(0, 212, 255, 0.3);
      background: rgba(0, 212, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      line-height: 1.8;
      color: var(--text);
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .feed { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>CYPHER</span> 威胁感知中心</div>
    <nav>
      <a href="/dashboard" aria-current="page">主界面</a>
      <a href="/events">事件中心</a>
      <a href="/settings">检测配置</a>
      <a href="/recordings">录像</a>
      <button id="skill-manager-open" type="button">技能管理</button>
    </nav>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <div>
          <strong>实时画面</strong>
          <div class="meta">使用 CYPHER MJPEG 视频流刷新，支持 YOLO 框检测叠加</div>
        </div>
        <div class="status"><span id="sse-dot" class="dot"></span><span id="sse-status">SSE 未连接</span></div>
      </div>
      <div class="video-wrap">
        <img id="video-frame" alt="当前摄像头画面">
        <div class="detection-overlay" id="detection-overlay" aria-hidden="true"></div>
        <div class="video-label" id="active-camera-label">active</div>
      </div>
      <div class="camera-list" id="camera-list"></div>
      <div class="analysis-panel" aria-label="AI 分析">
        <div class="analysis-bar">
          <strong>AI 分析</strong>
          <span id="analysis-status">等待分析</span>
          <span id="analysis-time">--</span>
        </div>
        <div class="analysis-content" id="analysis-content">等待摄像头帧或 AI 分析结果。</div>
      </div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <div>
          <strong>威胁感知</strong>
          <div class="meta">最近 20 条告警</div>
        </div>
        <button id="clear-alerts" style="text-align:center;">清空</button>
      </div>
      <div class="feed" id="alert-feed">
        <div class="empty" id="empty-feed">暂无实时告警</div>
      </div>
    </aside>
  </main>

  <div class="modal-backdrop" id="skill-modal" hidden>
    <section class="skill-modal" role="dialog" aria-modal="true" aria-labelledby="skill-modal-title">
      <div class="modal-head">
        <div>
          <strong id="skill-modal-title">技能管理</strong>
          <div class="meta">技能只会在用户明确启用后参与 AI 分析。</div>
        </div>
        <button id="skill-modal-close" type="button">关闭</button>
      </div>
      <div class="skill-tabs" role="tablist" aria-label="技能管理标签">
        <button class="skill-tab" type="button" data-tab="enabled" aria-selected="true">已启用</button>
        <button class="skill-tab" type="button" data-tab="all" aria-selected="false">全部技能</button>
        <button class="skill-tab" type="button" data-tab="safety" aria-selected="false">安全说明</button>
      </div>
      <div class="skill-modal-body" id="skill-modal-body"></div>
      <div class="modal-actions">
        <button id="skill-refresh" type="button">刷新技能列表</button>
        <button id="skill-modal-close-bottom" type="button">关闭</button>
      </div>
    </section>
  </div>

  <script>
    let cameras = [];
    let activeCameraId = '';
    let eventSource = null;
    let skillTab = 'enabled';
    let skillItems = [];
    let frameLoading = false;
    let lastFrameRequestAt = 0;
    let sseConnected = false;
    let latestDetections = [];
    let latestDetectionsAt = 0;
    let latestDetectionsCameraId = '';
    let detectionOverlayTimer = null;
    const FRAME_REFRESH_MS = 500;
    const ANALYSIS_FALLBACK_MS = 10000;
    const DETECTION_OVERLAY_TTL_MS = 12000;
    const seenAlerts = new Set();
    const alertFeed = document.getElementById('alert-feed');
    const analysisContent = document.getElementById('analysis-content');
    const analysisStatus = document.getElementById('analysis-status');
    const analysisTime = document.getElementById('analysis-time');
    const detectionOverlay = document.getElementById('detection-overlay');
    const skillModal = document.getElementById('skill-modal');
    const skillModalBody = document.getElementById('skill-modal-body');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function severityClass(value) {
      const normalized = String(value || '').toLowerCase();
      if (normalized === 'critical' || normalized === 'danger') return 'critical';
      if (normalized === 'warning') return 'warning';
      return 'info';
    }

    function severityText(value) {
      const normalized = String(value || '').toLowerCase();
      if (normalized === 'critical' || normalized === 'danger') return '高危';
      if (normalized === 'warning') return '警告';
      return '信息';
    }

    function confidenceText(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${(number * 100).toFixed(1)}%` : 'N/A';
    }

    function timeText(value) {
      if (!value) return new Date().toLocaleTimeString('zh-CN', { hour12: false });
      if (typeof value === 'number') return new Date(value).toLocaleString('zh-CN', { hour12: false });
      return String(value);
    }

    function clampNumber(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, number));
    }

    function detectionColor(severity) {
      const normalized = String(severity || '').toLowerCase();
      if (normalized === 'critical' || normalized === 'danger' || normalized === 'high') return '#ef4444';
      if (normalized === 'warning' || normalized === 'medium') return '#f59e0b';
      return '#00d4ff';
    }

    function detectionLabel(detection) {
      const label = detection.name || detection.label || detection.className || detection.class || detection.type || 'object';
      const confidence = Number(detection.confidence ?? detection.conf ?? detection.score);
      return Number.isFinite(confidence) ? `${label} ${(confidence * 100).toFixed(0)}%` : String(label);
    }

    function normalizeDetectionBox(detection, sourceWidth, sourceHeight) {
      if (!detection || !sourceWidth || !sourceHeight) return null;
      const source = detection.box || detection.bbox || detection.xyxy || detection.rect;
      if (!source) return null;

      let x1;
      let y1;
      let x2;
      let y2;

      if (Array.isArray(source)) {
        if (source.length < 4) return null;
        x1 = Number(source[0]);
        y1 = Number(source[1]);
        const third = Number(source[2]);
        const fourth = Number(source[3]);
        const format = String(detection.boxFormat || detection.bboxFormat || '').toLowerCase();
        if (format.includes('xywh')) {
          x2 = x1 + third;
          y2 = y1 + fourth;
        } else {
          x2 = third;
          y2 = fourth;
        }
      } else {
        x1 = Number(source.x1 ?? source.left ?? source.x ?? 0);
        y1 = Number(source.y1 ?? source.top ?? source.y ?? 0);
        x2 = source.x2 !== undefined || source.right !== undefined
          ? Number(source.x2 ?? source.right)
          : x1 + Number(source.w ?? source.width ?? 0);
        y2 = source.y2 !== undefined || source.bottom !== undefined
          ? Number(source.y2 ?? source.bottom)
          : y1 + Number(source.h ?? source.height ?? 0);
      }

      if (![x1, y1, x2, y2].every(Number.isFinite)) return null;
      if (x1 >= 0 && y1 >= 0 && x2 <= 1 && y2 <= 1) {
        x1 *= sourceWidth;
        x2 *= sourceWidth;
        y1 *= sourceHeight;
        y2 *= sourceHeight;
      }

      const left = clampNumber(Math.min(x1, x2), 0, sourceWidth - 1);
      const top = clampNumber(Math.min(y1, y2), 0, sourceHeight - 1);
      const right = clampNumber(Math.max(x1, x2), 0, sourceWidth);
      const bottom = clampNumber(Math.max(y1, y2), 0, sourceHeight);
      const width = Math.max(1, right - left);
      const height = Math.max(1, bottom - top);
      return { x: left, y: top, w: width, h: height };
    }

    function getRenderedImageRect(image, container) {
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const sourceWidth = image.naturalWidth || containerWidth;
      const sourceHeight = image.naturalHeight || containerHeight;
      if (!containerWidth || !containerHeight || !sourceWidth || !sourceHeight) return null;

      const containerRatio = containerWidth / containerHeight;
      const sourceRatio = sourceWidth / sourceHeight;
      if (sourceRatio > containerRatio) {
        const width = containerWidth;
        const height = width / sourceRatio;
        return { left: 0, top: (containerHeight - height) / 2, width, height, sourceWidth, sourceHeight };
      }
      const height = containerHeight;
      const width = height * sourceRatio;
      return { left: (containerWidth - width) / 2, top: 0, width, height, sourceWidth, sourceHeight };
    }

    function clearDetectionOverlay() {
      latestDetections = [];
      latestDetectionsAt = 0;
      latestDetectionsCameraId = activeCameraId || 'active';
      if (detectionOverlayTimer) clearTimeout(detectionOverlayTimer);
      renderDetectionOverlay();
    }

    function setLatestDetections(detections, cameraId) {
      latestDetections = Array.isArray(detections) ? detections : [];
      latestDetectionsAt = Date.now();
      latestDetectionsCameraId = cameraId || activeCameraId || 'active';
      if (detectionOverlayTimer) clearTimeout(detectionOverlayTimer);
      if (latestDetections.length) {
        detectionOverlayTimer = setTimeout(() => {
          if (Date.now() - latestDetectionsAt >= DETECTION_OVERLAY_TTL_MS) clearDetectionOverlay();
        }, DETECTION_OVERLAY_TTL_MS + 100);
      }
      renderDetectionOverlay();
    }

    function renderDetectionOverlay() {
      if (!detectionOverlay) return;
      const image = document.getElementById('video-frame');
      const container = image?.parentElement;
      const activeId = activeCameraId || 'active';
      const cameraMatches = !latestDetectionsCameraId
        || latestDetectionsCameraId === activeId
        || latestDetectionsCameraId === 'active'
        || activeId === 'active';
      const stale = latestDetectionsAt > 0 && Date.now() - latestDetectionsAt > DETECTION_OVERLAY_TTL_MS;

      if (!image || !container || image.style.display === 'none' || !image.naturalWidth || !image.naturalHeight || stale || !cameraMatches || !latestDetections.length) {
        detectionOverlay.innerHTML = '';
        return;
      }

      const rect = getRenderedImageRect(image, container);
      if (!rect) {
        detectionOverlay.innerHTML = '';
        return;
      }

      detectionOverlay.innerHTML = latestDetections.map(detection => {
        const box = normalizeDetectionBox(detection, rect.sourceWidth, rect.sourceHeight);
        if (!box) return '';
        const left = rect.left + (box.x / rect.sourceWidth) * rect.width;
        const top = rect.top + (box.y / rect.sourceHeight) * rect.height;
        const width = (box.w / rect.sourceWidth) * rect.width;
        const height = (box.h / rect.sourceHeight) * rect.height;
        const color = detectionColor(detection.severity || detection.risk_level || detection.level);
        const insideLabel = top < 30 ? ' inside-label' : '';
        return `
          <div class="detection-box${insideLabel}" style="--box-color:${color};left:${left}px;top:${top}px;width:${width}px;height:${height}px">
            <span class="detection-label">${escapeHtml(detectionLabel(detection))}</span>
          </div>
        `;
      }).join('');
    }

    function alertId(alert) {
      return alert.eventId || alert.id || `${alert.type || alert.title}-${alert.cameraId || alert.camera_id}-${alert.timestamp || Date.now()}`;
    }

    function normalizeAlert(alert) {
      const id = alertId(alert);
      return {
        id,
        title: alert.title || alert.categoryCn || alert.category_cn || alert.name || alert.type || '告警事件',
        severity: alert.severity || 'info',
        camera: alert.cameraLabel || alert.camera_label || alert.cameraId || alert.camera_id || 'active',
        confidence: alert.confidence,
        time: alert.created_at || alert.timestamp || new Date().toLocaleTimeString('zh-CN', { hour12: false }),
        type: alert.type || alert.alert_type || alert.category,
        snapshot: alert.snapshotPath || alert.snapshot_path || '',
        eventId: alert.eventId || alert.id
      };
    }

    function pushAlert(alert) {
      const item = normalizeAlert(alert);
      if (seenAlerts.has(item.id)) return;
      seenAlerts.add(item.id);
      document.getElementById('empty-feed')?.remove();
      const severity = severityClass(item.severity);
      const card = document.createElement('div');
      card.className = `alert-card ${severity}`;
      card.dataset.created = String(Date.now());
      const snapshotLink = item.eventId ? `<a href="/api/alerts/${encodeURIComponent(item.eventId)}/snapshot" target="_blank">查看快照</a>` : '';
      card.innerHTML = `
        <div class="alert-top">
          <div class="title">${escapeHtml(item.title)}</div>
          <span class="badge">${severityText(item.severity)}</span>
        </div>
        <div class="meta">摄像头：${escapeHtml(item.camera)}</div>
        <div class="meta">置信度：${escapeHtml(confidenceText(item.confidence))} / 类型：${escapeHtml(item.type || '-')}</div>
        <div class="meta">时间：${escapeHtml(item.time)} ${snapshotLink}</div>
      `;
      alertFeed.prepend(card);
      while (alertFeed.querySelectorAll('.alert-card').length > 20) {
        alertFeed.lastElementChild.remove();
      }
    }

    function pushLegacyAlert(data) {
      if (!data.alert) return;
      const details = Array.isArray(data.alert_details) ? data.alert_details : [data.alert_message || '检测到风险'];
      for (const detail of details) {
        pushAlert({
          title: detail,
          severity: data.risk_level === 'high' ? 'critical' : 'warning',
          cameraId: activeCameraId || 'active',
          confidence: null,
          timestamp: data.time
        });
      }
    }

    // Audio alert siren removed by user request

    function handleRealtimePayload(data) {
      const alerts = Array.isArray(data.alerts) ? data.alerts : [];
      if (alerts.length) alerts.forEach(pushAlert);
      else pushLegacyAlert(data);
    }

    function updateAnalysisDisplay(data) {
      const alerts = Array.isArray(data.alerts) ? data.alerts : [];
      const hasDetectionPayload = Object.prototype.hasOwnProperty.call(data, 'detections');
      const detections = Array.isArray(data.detections) ? data.detections : [];
      const details = Array.isArray(data.alert_details) ? data.alert_details : [];
      const risk = data.risk_level || (alerts.length ? 'high' : 'none');
      const status = data.analyzing ? '分析中' : (alerts.length || data.alert ? '发现风险' : '正常/等待');
      const lines = [];

      if (data.text) lines.push(String(data.text));
      if (data.alert_message) lines.push(`告警：${data.alert_message}`);
      if (details.length) lines.push(`风险详情：${details.join('、')}`);
      if (alerts.length) {
        lines.push(`结构化告警：${alerts.map(item => item.title || item.name || item.type || item.alert_type).filter(Boolean).join('、')}`);
      }
      if (detections.length) {
        lines.push(`检测目标：${detections.map(item => {
          const label = item.name || item.label || item.type || 'unknown';
          const confidence = Number.isFinite(Number(item.confidence)) ? ` ${confidenceText(item.confidence)}` : '';
          return `${label}${confidence}`;
        }).join('、')}`);
      }
      if (data.cleanup_hint) lines.push(`处置建议：${data.cleanup_hint}`);
      if (data.evacuate_text) lines.push(`疏散提示：${data.evacuate_text}`);
      if (!lines.length) lines.push(data.analyzing ? 'AI 正在分析当前画面...' : '等待摄像头帧或 AI 分析结果。');

      if (hasDetectionPayload) setLatestDetections(detections, data.cameraId || data.camera_id || activeCameraId);
      analysisStatus.textContent = `状态：${status} / 风险：${risk}`;
      analysisTime.textContent = `更新时间：${timeText(data.time || data.timestamp)}`;
      analysisContent.innerHTML = `
        <div>${escapeHtml(lines.join('\n'))}</div>
        <div class="analysis-tags">
          <span class="analysis-tag">alerts: ${alerts.length}</span>
          <span class="analysis-tag">detections: ${detections.length}</span>
          <span class="analysis-tag">fallback: /api/analysis 10秒</span>
        </div>
      `;
    }

    // 视频流状态：0=无画面(红), 1=有画面(绿)
    let videoStreamState = 0;
    let sseIsConnected = false; // SSE连接状态

    function setSseStatus(state) {
      const dot = document.getElementById('sse-dot');
      const statusText = document.getElementById('sse-status');
      
      // 根据SSE连接状态和视频流状态自动决定文字和颜色
      if (sseIsConnected && videoStreamState === 1) {
        statusText.textContent = 'SSE 已连接';
        dot.className = 'dot ok'; // 绿色：已连接且有画面
      } else if (sseIsConnected && videoStreamState === 0) {
        statusText.textContent = 'SSE 未连接';
        dot.className = 'dot danger'; // 红色：已连接但无画面
      } else if (!sseIsConnected) {
        statusText.textContent = 'SSE 未连接';
        dot.className = 'dot danger'; // 红色：未连接
      } else {
        dot.className = `dot ${state || ''}`;
      }
      sseConnected = state === 'ok';
    }

    function updateVideoStreamState(hasFrame) {
      if (hasFrame) {
        videoStreamState = 1; // 有画面
      } else {
        videoStreamState = 0; // 无画面
      }
      // 立即刷新状态显示
      setSseStatus(videoStreamState === 1 ? 'ok' : 'danger');
    }

    function connectSse() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource('/api/events');
      eventSource.onopen = () => {
        sseIsConnected = true;
        setSseStatus('ok');
      };
      eventSource.onerror = () => {
        sseIsConnected = false;
        setSseStatus('danger');
      };
      eventSource.onmessage = event => {
        try {
          const data = JSON.parse(event.data);
          handleRealtimePayload(data);
          updateAnalysisDisplay(data);
        }
        catch (error) { console.warn('SSE payload parse failed:', error.message); }
      };
    }

    async function pollAnalysis(force = false) {
      // SSE 正常时，/api/analysis 只作为低频兜底，避免和实时流重复刷新 UI。
      if (sseConnected && !force) return;
      try {
        const response = await fetch('/api/analysis?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        handleRealtimePayload(data);
        updateAnalysisDisplay(data);
      } catch (error) {
        console.warn('analysis fallback failed:', error.message);
      }
    }

    function streamEndpoint() {
      if (!activeCameraId || activeCameraId === 'webrtc' || activeCameraId === 'active') {
        return '/api/stream?fps=25&boxes=0';
      }
      return `/api/cameras/${encodeURIComponent(activeCameraId)}/stream?fps=25&boxes=0`;
    }

    function refreshStream(force = false) {
      const image = document.getElementById('video-frame');
      const base = streamEndpoint();
      const src = `${base}&t=${Date.now()}`;

      if (!force && image.dataset.streamSrc === base) return;
      image.dataset.streamSrc = base;

      image.onload = () => {
        image.style.display = 'block';
        // 有画面时更新状态
        updateVideoStreamState(true);
        renderDetectionOverlay();
      };

      image.onerror = () => {
        image.style.display = 'none';
        // 无画面时更新状态
        updateVideoStreamState(false);
        renderDetectionOverlay();
      };

      image.style.display = 'none';
      image.src = src;
    }

    function renderCameras() {
      const list = document.getElementById('camera-list');
      if (!cameras.length) {
        list.innerHTML = '<div class="meta">暂无摄像头；将显示 active 当前帧。</div>';
        document.getElementById('active-camera-label').textContent = 'active';
        return;
      }
      list.innerHTML = cameras.map(camera => `
        <button class="${camera.id === activeCameraId ? 'active' : ''}" data-camera="${escapeHtml(camera.id)}">
          <strong>${escapeHtml(camera.label || camera.id)}</strong><br>
          <span class="meta">${escapeHtml(camera.id)} / ${escapeHtml(camera.status || '-')} / ${camera.hasFrame ? '有帧' : '无帧'} / ${Number(camera.frameCount || 0)}</span>
        </button>
      `).join('');
      list.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', async () => {
          const nextId = button.dataset.camera;
          activeCameraId = nextId;
          clearDetectionOverlay();

          try {
            await fetch('/api/cameras/active', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: nextId })
            });
          } catch (error) {
            console.warn('active camera sync failed:', error.message);
          }

          renderCameras();
          refreshStream(true);
        });
      });
      const active = cameras.find(camera => camera.id === activeCameraId);
      document.getElementById('active-camera-label').textContent = active ? (active.label || active.id) : activeCameraId;
    }
    async function loadCameras() {
      const previousActiveId = activeCameraId;
      try {
        const response = await fetch('/api/cameras', { cache: 'no-store' });
        const data = await response.json();
        cameras = data.cameras || [];
        const hasActive = cameras.some(camera => camera.id === activeCameraId);
        const frameCamera = cameras.find(camera => camera.hasFrame);
        if (!activeCameraId || !hasActive) {
          activeCameraId = data.active || frameCamera?.id || cameras[0]?.id || 'active';
        }
        if ((activeCameraId === 'webrtc' || activeCameraId === 'active') && frameCamera) {
          activeCameraId = frameCamera.id;
        }
        renderCameras();
        if (previousActiveId !== activeCameraId) {
          clearDetectionOverlay();
          refreshStream(true);
        }
      } catch (error) {
        cameras = [];
        activeCameraId = activeCameraId || 'active';
        renderCameras();
      }
    }
    document.getElementById('clear-alerts').addEventListener('click', () => {
      alertFeed.innerHTML = '<div class="empty" id="empty-feed">暂无实时告警</div>';
      seenAlerts.clear();
    });

    function openSkillModal() {
      skillModal.hidden = false;
      loadSkills();
    }

    function closeSkillModal() {
      skillModal.hidden = true;
    }

    function setSkillTab(nextTab) {
      skillTab = nextTab;
      document.querySelectorAll('.skill-tab').forEach(tab => {
        tab.setAttribute('aria-selected', tab.dataset.tab === skillTab ? 'true' : 'false');
      });
      renderSkills();
    }

    async function loadSkills() {
      skillModalBody.innerHTML = '<div class="meta">正在读取技能列表...</div>';
      try {
        const response = await fetch('/api/skills', { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '读取技能失败');
        skillItems = Array.isArray(data.skills) ? data.skills : [];
        renderSkills();
      } catch (error) {
        skillModalBody.innerHTML = `<div class="safety-note">技能列表读取失败：${escapeHtml(error.message)}</div>`;
      }
    }

    function renderSkillRow(skill) {
      const label = skill.label || skill.name || skill.id || '未命名技能';
      const type = skill.type || 'unknown';
      const description = skill.description || '暂无描述';
      const enabled = skill.enabled === true;
      const nextEnabled = !enabled;
      const action = enabled ? '禁用' : '启用';
      return `
        <div class="skill-row">
          <div class="skill-row-top">
            <div>
              <strong>${escapeHtml(label)}</strong>
              <div class="meta">${escapeHtml(skill.id || skill.name || '-')} / ${escapeHtml(type)} / ${enabled ? '已启用' : '未启用'}</div>
            </div>
            <div class="skill-row-actions">
              <button type="button" data-skill-toggle="${escapeHtml(skill.id || skill.name)}" data-enabled="${String(nextEnabled)}">${action}</button>
            </div>
          </div>
          <div class="meta">${escapeHtml(description)}</div>
        </div>
      `;
    }

    function renderSkills() {
     if (skillTab === 'safety') {
      skillModalBody.innerHTML = `
        <div class="safety-note">
          <strong>安全说明</strong><br>
          Web 技能安装已禁用。页面不支持上传新技能。新技能必须通过受控本地部署流程加入。安装不等于启用；只有用户在这里明确启用后，技能才会参与 AI 分析。
        </div>
      `;
  return;
}

      const rows = skillTab === 'enabled' ? skillItems.filter(skill => skill.enabled === true) : skillItems;
      if (!rows.length) {
        skillModalBody.innerHTML = `<div class="empty">${skillTab === 'enabled' ? '暂无已启用技能' : '暂无技能'}</div>`;
        return;
      }
      skillModalBody.innerHTML = rows.map(renderSkillRow).join('');
      skillModalBody.querySelectorAll('[data-skill-toggle]').forEach(button => {
        button.addEventListener('click', () => toggleSkill(button.dataset.skillToggle, button.dataset.enabled === 'true'));
      });
    }

    async function toggleSkill(skillId, enabled) {
      if (!skillId) return;
      const ok = window.confirm(`${enabled ? '启用' : '禁用'}技能 ${skillId}？启用后该技能会参与 AI 分析。`);
      if (!ok) return;
      try {
        const response = await fetch('/api/skills/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ skill: skillId, enabled })
        });
        const data = await response.json();
        if (!response.ok || data.success === false) throw new Error(data.error || '切换技能失败');
        await loadSkills();
      } catch (error) {
        alert(`技能切换失败：${error.message}`);
      }
    }

    document.getElementById('skill-manager-open').addEventListener('click', openSkillModal);
    document.getElementById('skill-modal-close').addEventListener('click', closeSkillModal);
    document.getElementById('skill-modal-close-bottom').addEventListener('click', closeSkillModal);
    document.getElementById('skill-refresh').addEventListener('click', loadSkills);
    document.querySelectorAll('.skill-tab').forEach(tab => {
      tab.addEventListener('click', () => setSkillTab(tab.dataset.tab));
    });
    skillModal.addEventListener('click', event => {
      if (event.target === skillModal) closeSkillModal();
    });

    connectSse();
    loadCameras().then(() => refreshStream(true));
    pollAnalysis(true);
    window.addEventListener('resize', renderDetectionOverlay);
    setInterval(loadCameras, 3000);
    setInterval(pollAnalysis, 3000);
  </script>
</body>
</html>
