<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>AI 摄像头推流端</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --panel: rgba(255, 255, 255, 0.08);
            --panel-soft: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --line: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.12);
            --primary: #00d4ff;
            --accent: #00d4ff;
            --primary-light: #00e5ff;
            --success: #34d399;
            --ok: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --glass-blur: blur(20px);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        header {
            height: 56px;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.3px;
        }

        .logo span {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo i {
            color: var(--primary-light);
            font-size: 18px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.8rem;
            background: rgba(248, 113, 113, 0.12);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .status-badge.connected {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.2), rgba(52, 211, 153, 0.1));
            color: var(--success);
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 0 16px rgba(52, 211, 153, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px currentColor;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: hidden;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(1);
        }

        video.active {
            display: block;
        }

        .placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .placeholder i {
            font-size: clamp(3rem, 15vw, 4rem);
            margin-bottom: 16px;
            display: block;
            color: rgba(0, 212, 255, 0.3);
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.2));
        }

        .placeholder p {
            font-size: clamp(0.95rem, 4.5vw, 1.1rem);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .placeholder .hint {
            font-size: clamp(0.8rem, 3.5vw, 0.9rem);
            color: var(--text-muted);
            opacity: 0.8;
        }

        .controls {
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--line);
            flex-shrink: 0;
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn {
            width: 100%;
            padding: 18px 24px;
            border: none;
            border-radius: 14px;
            font-size: clamp(1rem, 4.5vw, 1.1rem);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 56px;
            letter-spacing: -0.2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #0099cc 100%);
            color: #00111d;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.4), 0 0 0 0 rgba(0, 212, 255, 0);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 212, 255, 0.5), 0 0 0 0 rgba(0, 212, 255, 0.2);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
            color: white;
            border: 1px solid rgba(248, 113, 113, 0.3);
            box-shadow: 0 4px 16px rgba(248, 113, 113, 0.4), 0 0 0 0 rgba(248, 113, 113, 0);
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(248, 113, 113, 0.5), 0 0 0 0 rgba(248, 113, 113, 0.2);
        }

        .btn-danger:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 8px rgba(248, 113, 113, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn.btn-loading {
            position: relative;
            pointer-events: none;
        }

        .btn.btn-loading i {
            opacity: 0;
        }

        .btn.btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-panel {
            padding: 12px 20px;
            background: var(--panel-soft);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            font-size: clamp(0.8rem, 3.5vw, 0.9rem);
            color: var(--text-muted);
            word-break: break-word;
            line-height: 1.5;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel i {
            color: var(--primary-light);
            font-size: 14px;
            flex-shrink: 0;
        }

        .info-panel strong {
            color: var(--text);
            font-weight: 600;
        }

        /* 录制指示器 */
        .rec-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.9), rgba(248, 113, 113, 0.7));
            padding: 8px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 10;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 16px rgba(248, 113, 113, 0.5);
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .rec-indicator.active {
            display: flex;
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            animation: blink 1s infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        /* 竖屏时视频方向优化 */
        @media (orientation: portrait) {
            video {
                object-fit: cover;
            }
        }

        @media (orientation: landscape) {
            video {
                object-fit: contain;
            }
        }

        /* 超小屏幕优化 */
        @media (max-width: 360px) {
            header {
                height: 48px;
                padding: 0 12px;
            }
            .controls {
                padding: 12px;
            }
        }

        /* 防止 iOS Safari 底部栏影响 */
        @supports (-webkit-touch-callout: none) {
            body {
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-camera"></i>
            <span>AI 摄像头推流</span>
        </div>
        <div class="status-badge" id="status-badge">
            <span class="pulse-dot"></span>
            <span id="status-text">未连接</span>
        </div>
    </header>

    <div class="video-container">
        <div class="rec-indicator" id="rec-indicator">
            <div class="rec-dot"></div>
            <span>LIVE</span>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholder">
            <i class="fa-solid fa-video-slash"></i>
            <p>摄像头未启动</p>
            <p class="hint">点击下方按钮开始推流</p>
        </div>
    </div>

    <div class="info-panel">
        <i class="fa-solid fa-circle-info"></i>
        <span id="info-text">准备就绪，等待连接...</span>
    </div>
    <div class="info-panel" style="border-top: 1px solid #333;">
        <i class="fa-solid fa-network-wired"></i>
        <span id="server-info">正在获取服务器信息...</span>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="startBtn" onclick="startWebRTC()">
            <i class="fa-solid fa-play"></i> 开始推流        </button>
    </div>

    <script>
        const BACKEND_URL = '';
        const AUDIO_DEVICE_STORAGE_KEY = 'cypher.audioInputDeviceId';

        let pc;
        let stream;

        const video = document.getElementById('video');
        const placeholder = document.getElementById('placeholder');
        const startBtn = document.getElementById('startBtn');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const infoText = document.getElementById('info-text');
        const recIndicator = document.getElementById('rec-indicator');
        const serverInfo = document.getElementById('server-info');

        function apiUrl(path) {
            return BACKEND_URL ? BACKEND_URL + path : path;
        }

        function getPeerConnectionConstructor() {
            const PeerConnection =
                window.RTCPeerConnection ||
                window.webkitRTCPeerConnection ||
                window.mozRTCPeerConnection;

            if (typeof PeerConnection !== 'function') {
                throw new Error('当前运行环境不支持 RTCPeerConnection，请使用 Chrome/Edge，并通过项目 HTTPS 页面打开，不要直接 file:// 打开');
            }
            return PeerConnection;
        }

        function ensureCameraSupport() {
            if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                throw new Error('摄像头采集需要 HTTPS 安全上下文，请通过 nginx HTTPS 地址访问');
            }
            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                throw new Error('当前浏览器无法访问摄像头，请检查浏览器版本、HTTPS 页面和摄像头权限');
            }
        }

        async function loadServerInfo() {
            try {
                const response = await fetch(apiUrl('/api/info'));
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                const ip = (data.ips && data.ips[0]) || window.location.hostname;
                serverInfo.innerHTML = '服务器: <strong>' + (BACKEND_URL || ('https://' + ip + ':8082')) + '</strong>';
            } catch (e) {
                serverInfo.textContent = '服务器: ' + (BACKEND_URL || window.location.host);
            }
        }
        loadServerInfo();

        async function loadPreferredAudioDeviceId() {
            const localDeviceId = localStorage.getItem(AUDIO_DEVICE_STORAGE_KEY) || '';
            if (localDeviceId) return localDeviceId;

            try {
                const response = await fetch(apiUrl('/api/detection/config'), { cache: 'no-store' });
                if (!response.ok) return '';
                const data = await response.json();
                return data?.config?.audio?.inputDeviceId || '';
            } catch (_) {
                return '';
            }
        }

        function defaultAudioConstraints() {
            return {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            };
        }

        async function buildAudioConstraints() {
            const deviceId = await loadPreferredAudioDeviceId();
            const constraints = defaultAudioConstraints();
            if (deviceId) {
                constraints.deviceId = { exact: deviceId };
            }
            return constraints;
        }

        async function startWebRTC() {
            startBtn.classList.add('btn-loading');
            startBtn.disabled = true;
            infoText.textContent = '正在获取摄像头权限...';

            try {
                ensureCameraSupport();
                const PeerConnection = getPeerConnectionConstructor();
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: isMobile ? 1920 : 1280 },
                        height: { ideal: isMobile ? 1080 : 720 }
                    },
                    audio: await buildAudioConstraints()
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints).catch(async (error) => {
                    if (constraints.audio && constraints.audio.deviceId) {
                        console.warn('指定麦克风获取失败，回退到系统默认麦克风:', error.message);
                        try {
                            return await navigator.mediaDevices.getUserMedia({
                                video: constraints.video,
                                audio: defaultAudioConstraints()
                            });
                        } catch (fallbackError) {
                            console.warn('系统默认麦克风获取失败，回退为仅摄像头:', fallbackError.message);
                        }
                    }
                    console.warn('摄像头+麦克风获取失败，回退为仅摄像头:', error.message);
                    return navigator.mediaDevices.getUserMedia({
                        video: constraints.video,
                        audio: false
                    });
                });

                video.srcObject = stream;
                video.classList.add('active');
                placeholder.style.display = 'none';

                video.onloadedmetadata = () => {
                    const track = stream.getVideoTracks()[0];
                    const settings = track ? track.getSettings() : {};
                    if (settings.facingMode === 'user') {
                        video.style.transform = 'scaleX(-1)';
                    }
                };

                const hasAudioTrack = stream.getAudioTracks().length > 0;
                infoText.textContent = hasAudioTrack
                    ? '✓ 摄像头和麦克风已获取，正在建立 WebRTC 连接...'
                    : '✓ 摄像头已获取，未启用麦克风，正在建立 WebRTC 连接...';
                pc = new PeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(apiUrl('/offer'), {
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                        label: stream.getAudioTracks().length > 0 ? '浏览器摄像头+麦克风' : '浏览器摄像头'
                    }),
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST'
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + text.substring(0, 120));
                }

                const answer = await response.json();
                await pc.setRemoteDescription(answer);

                statusBadge.classList.add('connected');
                statusText.textContent = '已连接';
                infoText.innerHTML = '<strong>✓ 视频流正在实时传输中</strong>';
                recIndicator.classList.add('active');

                startBtn.innerHTML = '<i class="fa-solid fa-stop"></i> 停止推流';
                startBtn.classList.remove('btn-primary', 'btn-loading');
                startBtn.classList.add('btn-danger');
                startBtn.onclick = stopWebRTC;
            } catch (e) {
                console.error(e);
                infoText.innerHTML = '<span style="color: var(--danger);">✗ 连接失败: ' + e.message + '</span>';
                stopWebRTC(false);
            } finally {
                startBtn.classList.remove('btn-loading');
                startBtn.disabled = false;
            }
        }

        function stopWebRTC(updateText = true) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (pc) {
                pc.close();
                pc = null;
            }

            video.srcObject = null;
            video.classList.remove('active');
            placeholder.style.display = 'block';
            recIndicator.classList.remove('active');

            statusBadge.classList.remove('connected');
            statusText.textContent = '未连接';
            if (updateText) infoText.textContent = '推流已停止';

            startBtn.innerHTML = '<i class="fa-solid fa-play"></i> 开始推流';
            startBtn.classList.remove('btn-danger');
            startBtn.classList.add('btn-primary');
            startBtn.onclick = startWebRTC;
        }

        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (pc) pc.close();
        });
    </script>
</body>
</html>
