<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <title>AI 摄像头推流端</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            height: 56px;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo span {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo i {
            color: var(--primary);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .video-container {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            transform: scaleX(1);
        }

        video.active {
            display: block;
        }

        .placeholder {
            text-align: center;
            color: #555;
            padding: 40px 20px;
        }

        .placeholder i {
            font-size: clamp(3rem, 15vw, 4rem);
            margin-bottom: 16px;
            display: block;
        }

        .placeholder p {
            font-size: clamp(0.9rem, 4vw, 1rem);
            margin-bottom: 8px;
        }

        .placeholder .hint {
            font-size: clamp(0.75rem, 3.5vw, 0.85rem);
            color: #666;
        }

        .controls {
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background-color: var(--card-bg);
            border-top: 1px solid #333;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: clamp(0.95rem, 4.5vw, 1.05rem);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s;
            min-height: 52px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:active {
            transform: scale(0.98);
            background-color: #2563eb;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:active {
            transform: scale(0.98);
            background-color: #dc2626;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-panel {
            padding: 10px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-top: 1px solid #333;
            font-size: clamp(0.75rem, 3.5vw, 0.85rem);
            color: var(--text-sub);
            word-break: break-word;
            line-height: 1.4;
            flex-shrink: 0;
        }

        .info-panel i {
            color: var(--primary);
            margin-right: 6px;
        }

        /* 录制指示器 */
        .rec-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.8);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 10;
        }

        .rec-indicator.active {
            display: flex;
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 竖屏时视频方向优化 */
        @media (orientation: portrait) {
            video {
                object-fit: cover;
            }
        }

        @media (orientation: landscape) {
            video {
                object-fit: contain;
            }
        }

        /* 超小屏幕优化 */
        @media (max-width: 360px) {
            header {
                height: 48px;
                padding: 0 12px;
            }
            .controls {
                padding: 12px;
            }
        }

        /* 防止 iOS Safari 底部栏影响 */
        @supports (-webkit-touch-callout: none) {
            body {
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-camera"></i>
            <span>AI 摄像头推流</span>
        </div>
        <div class="status-badge" id="status-badge">
            <span class="pulse-dot"></span>
            <span id="status-text">未连接</span>
        </div>
    </header>

    <div class="video-container">
        <div class="rec-indicator" id="rec-indicator">
            <div class="rec-dot"></div>
            <span>LIVE</span>
        </div>
        <video id="video" autoplay playsinline muted></video>
        <div class="placeholder" id="placeholder">
            <i class="fa-solid fa-video-slash"></i>
            <p>摄像头未启动</p>
            <p class="hint">点击下方按钮开始推流</p>
        </div>
    </div>

    <div class="info-panel">
        <i class="fa-solid fa-circle-info"></i>
        <span id="info-text">准备就绪，等待连接...</span>
    </div>
    <div class="info-panel" style="border-top: 1px solid #333;">
        <i class="fa-solid fa-network-wired"></i>
        <span id="server-info">正在获取服务器信息...</span>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="startBtn" onclick="startWebRTC()">
            <i class="fa-solid fa-play"></i> 开始推流        </button>
    </div>

    <script>
        const BACKEND_URL = '';

        let pc;
        let stream;

        const video = document.getElementById('video');
        const placeholder = document.getElementById('placeholder');
        const startBtn = document.getElementById('startBtn');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const infoText = document.getElementById('info-text');
        const recIndicator = document.getElementById('rec-indicator');
        const serverInfo = document.getElementById('server-info');

        function apiUrl(path) {
            return BACKEND_URL ? BACKEND_URL + path : path;
        }

        function getPeerConnectionConstructor() {
            const PeerConnection =
                window.RTCPeerConnection ||
                window.webkitRTCPeerConnection ||
                window.mozRTCPeerConnection;

            if (typeof PeerConnection !== 'function') {
                throw new Error('当前运行环境不支持 RTCPeerConnection，请使用 Chrome/Edge，并通过项目 HTTPS 页面打开，不要直接 file:// 打开');
            }
            return PeerConnection;
        }

        function ensureCameraSupport() {
            if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                throw new Error('摄像头采集需要 HTTPS 安全上下文，请通过 nginx HTTPS 地址访问');
            }
            if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
                throw new Error('当前浏览器无法访问摄像头，请检查浏览器版本、HTTPS 页面和摄像头权限');
            }
        }

        async function loadServerInfo() {
            try {
                const response = await fetch(apiUrl('/api/info'));
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                const ip = (data.ips && data.ips[0]) || window.location.hostname;
                serverInfo.innerHTML = '服务器: <strong>' + (BACKEND_URL || ('https://' + ip + ':8082')) + '</strong>';
            } catch (e) {
                serverInfo.textContent = '服务器: ' + (BACKEND_URL || window.location.host);
            }
        }
        loadServerInfo();

        async function startWebRTC() {
            startBtn.disabled = true;
            infoText.textContent = '正在获取摄像头权限...';

            try {
                ensureCameraSupport();
                const PeerConnection = getPeerConnectionConstructor();
                const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: isMobile ? 1920 : 1280 },
                        height: { ideal: isMobile ? 1080 : 720 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints).catch((error) => {
                    console.warn('摄像头+麦克风获取失败，回退为仅摄像头:', error.message);
                    return navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                });

                video.srcObject = stream;
                video.classList.add('active');
                placeholder.style.display = 'none';

                video.onloadedmetadata = () => {
                    const track = stream.getVideoTracks()[0];
                    const settings = track ? track.getSettings() : {};
                    if (settings.facingMode === 'user') {
                        video.style.transform = 'scaleX(-1)';
                    }
                };

                const hasAudioTrack = stream.getAudioTracks().length > 0;
                infoText.textContent = hasAudioTrack
                    ? '摄像头和麦克风已获取，正在建立 WebRTC 连接...'
                    : '摄像头已获取，未启用麦克风，正在建立 WebRTC 连接...';
                pc = new PeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(apiUrl('/offer'), {
                    body: JSON.stringify({
                        sdp: pc.localDescription.sdp,
                        type: pc.localDescription.type,
                        label: stream.getAudioTracks().length > 0 ? '浏览器摄像头+麦克风' : '浏览器摄像头'
                    }),
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST'
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + text.substring(0, 120));
                }

                const answer = await response.json();
                await pc.setRemoteDescription(answer);

                statusBadge.classList.add('connected');
                statusText.textContent = '已连接';
                infoText.textContent = '视频流正在实时传输中';
                recIndicator.classList.add('active');

                startBtn.innerHTML = '<i class="fa-solid fa-stop"></i> 停止推流';
                startBtn.classList.remove('btn-primary');
                startBtn.classList.add('btn-danger');
                startBtn.onclick = stopWebRTC;
            } catch (e) {
                console.error(e);
                infoText.textContent = '连接失败: ' + e.message;
                stopWebRTC(false);
            } finally {
                startBtn.disabled = false;
            }
        }

        function stopWebRTC(updateText = true) {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (pc) {
                pc.close();
                pc = null;
            }

            video.srcObject = null;
            video.classList.remove('active');
            placeholder.style.display = 'block';
            recIndicator.classList.remove('active');

            statusBadge.classList.remove('connected');
            statusText.textContent = '未连接';
            if (updateText) infoText.textContent = '推流已停止';

            startBtn.innerHTML = '<i class="fa-solid fa-play"></i> 开始推流';
            startBtn.classList.remove('btn-danger');
            startBtn.classList.add('btn-primary');
            startBtn.onclick = startWebRTC;
        }

        window.addEventListener('beforeunload', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            if (pc) pc.close();
        });
    </script>
</body>
</html>
