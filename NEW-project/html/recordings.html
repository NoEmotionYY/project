<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录制管理 - 真視眼</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --sidebar-bg: rgba(255, 255, 255, 0.06);
            --panel: rgba(255, 255, 255, 0.08);
            --panel-soft: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --line: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.12);
            --primary: #00d4ff;
            --accent: #00d4ff;
            --primary-light: #00e5ff;
            --success: #34d399;
            --ok: #34d399;
            --danger: #f87171;
            --warning: #fbbf24;
            --agent-bg: rgba(255, 255, 255, 0.06);
            --glass-blur: blur(20px);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glow-accent: 0 0 20px rgba(0, 212, 255, 0.4);
            --glow-ok: 0 0 20px rgba(52, 211, 153, 0.4);
            --glow-warn: 0 0 20px rgba(251, 191, 36, 0.4);
            --glow-danger: 0 0 20px rgba(248, 113, 113, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        header {
            height: 56px;
            background: var(--sidebar-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            color: var(--primary-light);
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }
        .back-btn:hover { 
            background: rgba(0, 212, 255, 0.2);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        header h1 {
            font-size: 18px;
            color: var(--primary-light);
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        header h1 i { margin-right: 8px; }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .header-actions button {
            padding: 8px 16px;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 10px;
            color: #c084fc;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }
        .header-actions button:hover {
            background: rgba(168, 85, 247, 0.22);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }
        .header-actions button.active {
            background: rgba(168, 85, 247, 0.3);
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 左侧摄像头列表 */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-light);
            background: rgba(255, 255, 255, 0.03);
        }
        .camera-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .camera-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 3px solid transparent;
            border-radius: 0 12px 12px 0;
            margin: 2px 8px 2px 0;
        }
        .camera-item:hover { 
            background: rgba(0, 212, 255, 0.12);
            transform: translateX(4px);
        }
        .camera-item.active {
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.15), rgba(0, 212, 255, 0.05));
            border-left-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
        }
        .cam-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .status-dot.connected { 
            background: var(--success);
            box-shadow: 0 0 12px var(--success), 0 0 20px rgba(52, 211, 153, 0.4);
            animation: pulse-green 2s infinite;
        }
        .status-dot.disconnected { 
            background: #64748b;
            box-shadow: 0 0 8px rgba(100, 116, 139, 0.3);
        }
        .status-dot.connecting { 
            background: var(--warning);
            box-shadow: 0 0 12px var(--warning), 0 0 20px rgba(251, 191, 36, 0.4);
            animation: pulse-yellow 1.5s infinite;
        }
        .status-dot.error { 
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger), 0 0 20px rgba(248, 113, 113, 0.4);
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        @keyframes pulse-yellow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .cam-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cam-id-tag {
            font-size: 11px;
            color: var(--text-muted);
        }
        .rec-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse-record 1.5s infinite;
            flex-shrink: 0;
            box-shadow: 0 0 16px var(--danger), 0 0 24px rgba(248, 113, 113, 0.5);
        }
        @keyframes pulse-record {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(100, 116, 139, 0.5);
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 22px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--success);
            box-shadow: 0 0 16px rgba(52, 211, 153, 0.6);
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(18px);
        }

        /* 中间文件区 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            min-width: 0;
        }
        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }
        .content-header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .content-header .meta {
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 99px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line);
            font-weight: 500;
        }
        .empty-files {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-files i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.5;
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .file-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .file-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .file-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .file-card:hover::before {
            opacity: 1;
        }
        .file-card.selected {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.12);
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.3), var(--shadow-lg);
        }
        .file-card.selected::before {
            background: linear-gradient(90deg, transparent, #a855f7, transparent);
            opacity: 1;
        }
        .file-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .file-icon {
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.12);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-light);
            font-size: 18px;
        }
        .file-card-title {
            font-size: 13px;
            font-weight: 500;
            word-break: break-all;
        }
        .file-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .file-card-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-sm {
            padding: 7px 14px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .btn-play {
            background: rgba(0, 212, 255, 0.15);
            color: var(--primary-light);
            border: 1px solid rgba(0, 212, 255, 0.25);
        }
        .btn-play:hover { 
            background: rgba(0, 212, 255, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        .btn-download {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 211, 153, 0.25);
        }
        .btn-download:hover { 
            background: rgba(52, 211, 153, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }
        .btn-delete {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }
        .btn-delete:hover { 
            background: rgba(248, 113, 113, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3);
        }
        .btn-agent {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }
        .btn-agent:hover { 
            background: rgba(168, 85, 247, 0.28);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }
        .btn-sm.btn-loading {
            position: relative;
            pointer-events: none;
            opacity: 0.7;
        }
        .btn-sm.btn-loading::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            top: 50%;
            left: 50%;
            margin-left: -7px;
            margin-top: -7px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 右侧 Agent 面板 */
        .agent-panel {
            width: 340px;
            background: var(--agent-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: margin-right 0.3s ease;
        }
        .agent-panel.collapsed {
            margin-right: -340px;
        }
        .agent-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #c084fc;
            background: rgba(255, 255, 255, 0.03);
        }
        .agent-header i { margin-right: 6px; }
        .agent-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .agent-msg {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.65;
            word-break: break-word;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .agent-msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 212, 255, 0.15));
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.15);
        }
        .agent-msg.bot {
            align-self: flex-start;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.18), rgba(168, 85, 247, 0.1));
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.1);
        }
        .agent-msg .msg-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .agent-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .agent-selected-file {
            font-size: 12px;
            color: #c084fc;
            padding: 8px 12px;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 8px;
            display: none;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .agent-selected-file.visible { display: block; }
        .agent-input-row {
            display: flex;
            gap: 8px;
        }
        .agent-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
        .agent-input:focus {
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }
        .agent-send {
            padding: 10px 16px;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 10px;
            color: #c084fc;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
        }
        .agent-send:hover {
            background: rgba(168, 85, 247, 0.3);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
        }
        .agent-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .agent-send.btn-loading {
            position: relative;
            pointer-events: none;
        }
        .agent-send.btn-loading i {
            opacity: 0;
        }
        .agent-send.btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: #c084fc;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .agent-placeholder {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            font-size: 13px;
        }
        .agent-placeholder i {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
            color: rgba(168, 85, 247, 0.3);
        }

        /* 视频弹窗 */
        .video-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .video-modal.active { display: flex; }
        .video-modal video {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
        }
        .video-modal .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-modal .close-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.2);
        }
        
        /* 右键菜单 */
        .context-menu {
            display: none;
            position: fixed;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 180px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            animation: menuFadeIn 0.15s ease;
        }
        @keyframes menuFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .context-menu.active { display: block; }
        .context-menu-item {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
        }
        .context-menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .context-menu-item i {
            width: 16px;
            text-align: center;
        }
        .context-menu-item.danger {
            color: #ef4444;
        }
        .context-menu-item.danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        .context-menu-divider {
            height: 1px;
            background: var(--border);
            margin: 6px 0;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 80px;
            right: 24px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text);
            font-size: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            z-index: 3000;
            animation: toastSlideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        @keyframes toastSlideIn {
            from { 
                opacity: 0; 
                transform: translateX(100px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }
        .toast.hiding {
            animation: toastSlideOut 0.3s ease forwards;
        }
        @keyframes toastSlideOut {
            from { 
                opacity: 1; 
                transform: translateX(0); 
            }
            to { 
                opacity: 0; 
                transform: translateX(100px); 
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="https://127.0.0.1:8443/dashboard" id="back-monitor-link" class="back-btn"><i class="fa fa-arrow-left"></i> 返回主界面</a>
            <h1><i class="fa fa-video-camera"></i> 录制管理</h1>
        </div>
        <div class="header-actions">
            <button id="agent-toggle-btn" onclick="toggleAgentPanel()" class="active">
                <i class="fa fa-robot"></i> AI Agent
            </button>
        </div>
    </header>

    <div class="main-layout">
        <!-- 左侧摄像头列表 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fa fa-video"></i>
                <span>摄像头列表</span>
            </div>
            <div class="camera-list" id="camera-list"></div>
        </div>

        <!-- 中间文件区 -->
        <div class="content" id="content">
            <div class="empty-files">
                <i class="fa fa-hand-o-left"></i>
                <div>请从左侧选择一个摄像头</div>
            </div>
        </div>

        <!-- 右侧 Agent 面板 -->
        <div class="agent-panel" id="agent-panel">
            <div class="agent-header">
                <span><i class="fa fa-robot"></i> AI 智能体</span>
                <button onclick="toggleAgentPanel()" style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:14px;">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <div class="agent-messages" id="agent-messages">
                <div class="agent-placeholder">
                    <i class="fa fa-robot"></i>
                    <div>选择一段录制视频</div>
                    <div style="margin-top:6px;font-size:12px;">点击文件卡片上的「🤖 分析」按钮<br>将视频发送给 Agent</div>
                </div>
            </div>
            <div class="agent-input-area">
                <div class="agent-selected-file" id="agent-selected-file"></div>
                <div class="agent-input-row">
                    <input type="text" class="agent-input" id="agent-input" placeholder="输入指令..." onkeydown="if(event.key==='Enter')sendAgentMsg()">
                    <button class="agent-send" id="agent-send-btn" onclick="sendAgentMsg()">
                        <i class="fa fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 视频播放弹窗 -->
    <div class="video-modal" id="video-modal">
        <button class="close-btn" onclick="closeVideo()"><i class="fa fa-times"></i></button>
        <video id="video-player" controls></video>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" onclick="openFileInExplorer()">
            <i class="fa fa-folder-open-o"></i>
            <span>打开所在文件夹</span>
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item danger" onclick="deleteFileFromMenu()">
            <i class="fa fa-trash-o"></i>
            <span>删除文件</span>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = '<div style="padding:40px 20px;color:#ef4444;text-align:center;"><h2><i class="fa fa-exclamation-circle"></i> 页面发生错误</h2><pre style="background:#1e1e1e;padding:16px;border-radius:8px;text-align:left;margin-top:20px;color:#e2e8f0;font-size:13px;overflow:auto;">' + msg + '\nLine: ' + line + '</pre><p style="margin-top:20px;color:#94a3b8;">请打开 Electron 控制台（Ctrl+Shift+I）查看详细错误</p></div>';
            return true;
        };

        const isElectron = !!window.electronAPI;
        let BACKEND_URL = isElectron ? 'https://127.0.0.1:8082' : '';

        // Electron 中 file:// 协议下相对链接无效，改为完整 URL
        // 同时获取动态端口
        if (isElectron && window.electronAPI.getPorts) {
            window.electronAPI.getPorts().then(ports => {
                if (ports.nodePort) BACKEND_URL = `https://127.0.0.1:${ports.nodePort}`;
                const backLink = document.getElementById('back-monitor-link');
                if (backLink && ports.nginxPort) backLink.href = `https://127.0.0.1:${ports.nginxPort}/dashboard`;
                loadRecordings();
            }).catch(() => {
                // 获取端口失败，使用默认端口
                const backLink = document.getElementById('back-monitor-link');
                if (backLink) backLink.href = 'https://127.0.0.1:8443/dashboard';
                loadRecordings();
            });
        } else {
            // 非 Electron 模式（浏览器访问 nginx），使用相对路径
            loadRecordings();
        }
        let recordings = [];
        let activeCamId = null;
        let selectedFile = null;
        let agentMessages = [];

        async function autoStartRec(camId) {
            return false;
            if (!autoRecEnabled || autoRecStarted.has(camId)) return;
            autoRecStarted.add(camId);
            try {
                const url = BACKEND_URL + '/api/recordings/' + camId + '/start';
                const resp = await fetch(url, { method: 'POST' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
            } catch (e) {
                console.error('自动录制失败:', e);
                autoRecStarted.delete(camId);
            }
        }

        async function loadRecordings() {
            try {
                const resp = await fetch(BACKEND_URL + '/api/recordings');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const ct = resp.headers.get('content-type') || '';
                if (!ct.includes('application/json')) throw new Error('响应格式错误 (收到 ' + ct + ')');
                const data = await resp.json();
                
                const oldRecordings = recordings;
                recordings = data.recordings || [];
                
                // 调试信息
                console.log('[录制页面] 加载完成:', recordings.length, '个摄像头');
                recordings.forEach(r => {
                    console.log(`  - ${r.cameraId}: ${r.files.length} 个文件, 录制中: ${r.isRecording}`);
                });
                
                renderSidebar();
                
                // 智能选择摄像头逻辑
                if (activeCamId) {
                    // 如果之前有选中的摄像头，保持选中并刷新内容
                    const stillExists = recordings.find(g => g.cameraId === activeCamId);
                    if (stillExists) {
                        renderContent(activeCamId);
                    } else {
                        // 选中的摄像头不存在了，选择第一个
                        if (recordings.length > 0) {
                            selectCamera(recordings[0].cameraId);
                        }
                    }
                } else if (recordings.length > 0) {
                    // 第一次加载，优先选择正在录制的摄像头
                    const recording = recordings.find(g => g.isRecording);
                    if (recording) {
                        selectCamera(recording.cameraId);
                        showToast('自动选择录制中的摄像头: ' + recording.cameraId);
                    } else {
                        // 没有录制中的，选择有文件的第一个摄像头
                        const hasFiles = recordings.find(g => g.files.length > 0);
                        if (hasFiles) {
                            selectCamera(hasFiles.cameraId);
                        }
                    }
                }
                
                // 检测是否有新文件（用于停止录制后自动刷新）
                if (oldRecordings.length > 0) {
                    recordings.forEach(newGroup => {
                        const oldGroup = oldRecordings.find(g => g.cameraId === newGroup.cameraId);
                        if (oldGroup && newGroup.files.length > oldGroup.files.length) {
                            console.log(`[录制页面] ${newGroup.cameraId} 有新文件: ${newGroup.files.length} > ${oldGroup.files.length}`);
                            // 如果当前正查看这个摄像头，显示提示
                            if (activeCamId === newGroup.cameraId) {
                                showToast(`✓ 检测到新录制文件`);
                            }
                        }
                    });
                }
            } catch (e) {
                console.error('加载录制列表失败:', e);
                document.getElementById('camera-list').innerHTML =
                    `<div class="empty-files"><i class="fa fa-exclamation-circle"></i>加载失败: ${escapeHtml(e.message)}</div>`;
                document.getElementById('content').innerHTML =
                    `<div class="empty-files"><i class="fa fa-exclamation-circle"></i>API 请求失败，请确认后端已重启</div>`;
            }
        }

        function renderSidebar() {
            const el = document.getElementById('camera-list');
            if (recordings.length === 0) {
                el.innerHTML = `<div class="empty-files"><i class="fa fa-video-camera"></i>暂无摄像头</div>`;
                return;
            }
            el.innerHTML = recordings.map(group => {
                const isActive = group.cameraId === activeCamId;
                const statusClass = group.status || 'unknown';
                return `
                    <div class="camera-item ${isActive ? 'active' : ''}" onclick="selectCamera('${group.cameraId}')">
                        <div class="cam-info">
                            <span class="status-dot ${statusClass}"></span>
                            <div style="min-width:0;">
                                <div class="cam-name">${escapeHtml(group.label || group.cameraId)}</div>
                                <div class="cam-id-tag">${escapeHtml(group.cameraId)}</div>
                            </div>
                            ${group.isRecording ? '<span class="rec-indicator"></span>' : ''}
                        </div>
                        <label class="toggle-switch" onclick="event.stopPropagation();">
                            <input type="checkbox" ${group.isRecording ? 'checked' : ''}
                                onchange="toggleRec('${group.cameraId}', this.checked)">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                `;
            }).join('');
        }

        function selectCamera(camId) {
            activeCamId = camId;
            renderSidebar();
            renderContent(camId);
        }

        function renderContent(camId) {
            const group = recordings.find(g => g.cameraId === camId);
            if (!group) return;

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="content-header">
                    <h2>${escapeHtml(group.label || group.cameraId)} <span style="font-size:13px;color:var(--text-muted);font-weight:400;">(${escapeHtml(group.cameraId)})</span></h2>
                    <div style="display:flex;align-items:center;gap:12px;">
                        <span class="meta">${group.files.length} 个文件</span>
                        <button class="btn-sm" onclick="loadRecordings()" title="刷新列表" style="padding:6px 12px;background:rgba(255,255,255,0.1);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
                            <i class="fa fa-refresh"></i> 刷新
                        </button>
                    </div>
                </div>
                ${group.files.length === 0
                    ? `<div class="empty-files"><i class="fa fa-folder-open-o"></i><div>暂无录制文件</div></div>`
                    : `<div class="file-grid">${group.files.map(f => {
                        const isSel = selectedFile && selectedFile.fileName === f.name && selectedFile.camId === group.cameraId;
                        return `
                        <div class="file-card ${isSel ? 'selected' : ''}" 
                             onclick="selectFile('${group.cameraId}', '${encodeURIComponent(f.name)}', this)"
                             oncontextmenu="showContextMenu(event, '${group.cameraId}', '${encodeURIComponent(f.name)}')">
                            <div class="file-card-header">
                                <div class="file-icon"><i class="fa fa-file-video-o"></i></div>
                                <div>
                                    <div class="file-card-title">${escapeHtml(f.name)}</div>
                                    <div class="file-card-meta">${f.sizeMb} MB · ${formatTime(f.created)}</div>
                                </div>
                            </div>
                            <div class="file-card-actions">
                                <button class="btn-sm btn-play" onclick="event.stopPropagation();playVideo('${group.cameraId}', '${encodeURIComponent(f.name)}')">
                                    <i class="fa fa-play"></i> 播放
                                </button>
                                <a class="btn-sm btn-download" onclick="event.stopPropagation()"
                                   href="${BACKEND_URL}/api/recordings/${group.cameraId}/${encodeURIComponent(f.name)}" download="${encodeURIComponent(f.name)}">
                                    <i class="fa fa-download"></i> 下载
                                </a>
                                <button class="btn-sm btn-delete" onclick="event.stopPropagation();deleteFile('${group.cameraId}', '${encodeURIComponent(f.name)}')">
                                    <i class="fa fa-trash"></i> 删除
                                </button>
                                <button class="btn-sm btn-agent" onclick="event.stopPropagation();sendFileToAgent('${group.cameraId}', '${encodeURIComponent(f.name)}', '${escapeHtml(f.name)}')">
                                    <i class="fa fa-robot"></i> 分析
                                </button>
                            </div>
                        </div>
                    `}).join('')}</div>`
                }
            `;
        }

        function selectFile(camId, fileName, el) {
            document.querySelectorAll('.file-card').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');
            selectedFile = { camId, fileName: decodeURIComponent(fileName), filePath: `${BACKEND_URL}/api/recordings/${camId}/${fileName}` };
            const selEl = document.getElementById('agent-selected-file');
            selEl.textContent = '📹 ' + selectedFile.fileName;
            selEl.classList.add('visible');
        }

        function sendFileToAgent(camId, fileName, displayName) {
            selectFile(camId, fileName, null);
            addAgentMessage('user', `请分析这段视频: ${displayName}`);
            addAgentMessage('bot', '正在分析视频...');
            // TODO: 对接 Agent API
            // agentAnalyzeVideo(camId, decodeURIComponent(fileName));
        }

        function addAgentMessage(role, text) {
            const container = document.getElementById('agent-messages');
            // 首次添加消息时清空 placeholder
            if (agentMessages.length === 0) container.innerHTML = '';
            agentMessages.push({ role, text, time: new Date().toLocaleTimeString('zh-CN', { hour12: false }) });

            const msgDiv = document.createElement('div');
            msgDiv.className = `agent-msg ${role}`;
            const timeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            msgDiv.innerHTML = `<div>${escapeHtml(text)}</div><div class="msg-time">${timeStr}</div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendAgentMsg() {
            const input = document.getElementById('agent-input');
            const sendBtn = document.getElementById('agent-send-btn');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            sendBtn.classList.add('btn-loading');
            sendBtn.disabled = true;
            
            addAgentMessage('user', text);
            
            try {
                // Simulate API delay
                await new Promise(resolve => setTimeout(resolve, 1000));
                addAgentMessage('bot', '✓ 收到指令，Agent 处理中...');
            } finally {
                sendBtn.classList.remove('btn-loading');
                sendBtn.disabled = false;
                input.focus();
            }
            // TODO: 对接 Agent API
            // const resp = await fetch('/api/agent/chat', { method: 'POST', body: JSON.stringify({ message: text, file: selectedFile }) });
        }

        function toggleAgentPanel() {
            const panel = document.getElementById('agent-panel');
            const btn = document.getElementById('agent-toggle-btn');
            panel.classList.toggle('collapsed');
            btn.classList.toggle('active');
        }

        async function toggleRec(camId, shouldRecord) {
            const toggleEl = event.target;
            toggleEl.disabled = true;
            
            try {
                const url = BACKEND_URL + '/api/recordings/' + camId + (shouldRecord ? '/start' : '/stop');
                const resp = await fetch(url, { method: 'POST' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                
                // 显示成功提示
                showToast(shouldRecord ? '✓ 开始录制' : '✓ 停止录制');
                
                // 立即刷新列表
                await loadRecordings();
            } catch (e) {
                alert('✗ 操作失败: ' + e.message);
                // 即使失败也刷新列表以恢复状态
                await loadRecordings();
            } finally {
                toggleEl.disabled = false;
            }
        }

        async function deleteFile(camId, fileName) {
            if (!confirm('⚠️ 确定要删除这个录制文件吗？\n此操作不可恢复！')) return;
            
            // Find and disable the delete button
            const deleteBtn = event.target.closest('.btn-delete');
            if (deleteBtn) {
                deleteBtn.classList.add('btn-loading');
                deleteBtn.disabled = true;
            }
            
            try {
                const resp = await fetch(BACKEND_URL + '/api/recordings/' + camId + '/' + fileName, { method: 'DELETE' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                
                // 显示成功提示
                showToast('✓ 文件已删除');
                
                // 立即刷新列表
                await loadRecordings();
            } catch (e) {
                alert('✗ 删除失败: ' + e.message);
                // 即使失败也刷新列表
                await loadRecordings();
            } finally {
                if (deleteBtn) {
                    deleteBtn.classList.remove('btn-loading');
                    deleteBtn.disabled = false;
                }
            }
        }

        function playVideo(camId, fileName) {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('video-player');
            player.src = BACKEND_URL + '/api/recordings/' + camId + '/' + fileName;
            modal.classList.add('active');
            player.play();
        }

        function closeVideo() {
            const modal = document.getElementById('video-modal');
            const player = document.getElementById('video-player');
            player.pause();
            player.src = '';
            modal.classList.remove('active');
        }

        // 右键菜单相关变量
        let contextMenuTarget = null; // { camId, fileName }

        // 显示右键菜单
        function showContextMenu(event, camId, fileName) {
            event.preventDefault();
            event.stopPropagation();
            
            contextMenuTarget = { camId, fileName: decodeURIComponent(fileName) };
            
            const menu = document.getElementById('context-menu');
            
            // 计算菜单位置，确保不超出屏幕
            let x = event.clientX;
            let y = event.clientY;
            
            // 等待下一帧以获取菜单尺寸
            requestAnimationFrame(() => {
                const menuWidth = menu.offsetWidth || 180;
                const menuHeight = menu.offsetHeight || 100;
                
                // 如果超出右边界，向左调整
                if (x + menuWidth > window.innerWidth) {
                    x = window.innerWidth - menuWidth - 10;
                }
                
                // 如果超出下边界，向上调整
                if (y + menuHeight > window.innerHeight) {
                    y = window.innerHeight - menuHeight - 10;
                }
                
                menu.style.left = x + 'px';
                menu.style.top = y + 'px';
                menu.classList.add('active');
            });
        }

        // 隐藏右键菜单
        function hideContextMenu() {
            const menu = document.getElementById('context-menu');
            menu.classList.remove('active');
            contextMenuTarget = null;
        }

        // 打开文件所在文件夹
        async function openFileInExplorer() {
            if (!contextMenuTarget) return;
            
            const { camId, fileName } = contextMenuTarget;
            
            try {
                // 调用后端 API 获取文件路径
                const resp = await fetch(BACKEND_URL + '/api/recordings/' + camId + '/' + encodeURIComponent(fileName) + '/path', {
                    method: 'GET'
                });
                
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                
                const data = await resp.json();
                
                if (window.electronAPI && window.electronAPI.openFolder) {
                    // Electron 环境下使用原生 API
                    await window.electronAPI.openFolder(data.filePath);
                } else {
                    // 浏览器环境下提示用户
                    alert('文件位置：\n' + data.filePath + '\n\n请在文件管理器中手动打开此路径。');
                }
            } catch (e) {
                console.error('打开文件夹失败:', e);
                alert('✗ 打开文件夹失败: ' + e.message);
            } finally {
                hideContextMenu();
            }
        }

        // 从右键菜单删除文件
        async function deleteFileFromMenu() {
            if (!contextMenuTarget) return;
            
            const { camId, fileName } = contextMenuTarget;
            
            if (!confirm('⚠️ 确定要删除这个录制文件吗？\n此操作不可恢复！')) {
                hideContextMenu();
                return;
            }
            
            try {
                const resp = await fetch(BACKEND_URL + '/api/recordings/' + camId + '/' + encodeURIComponent(fileName), { 
                    method: 'DELETE' 
                });
                
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                
                // 显示成功提示
                showToast('✓ 文件已删除');
                
                // 刷新列表
                await loadRecordings();
            } catch (e) {
                alert('✗ 删除失败: ' + e.message);
                // 即使失败也刷新列表
                await loadRecordings();
            } finally {
                hideContextMenu();
            }
        }

        // 点击其他地方关闭右键菜单
        document.addEventListener('click', () => {
            hideContextMenu();
        });

        // ESC 键关闭右键菜单
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideContextMenu();
                closeVideo();
            }
        });

        // Toast 提示功能
        function showToast(message, duration = 2000) {
            // 移除已有的 toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }

            // 创建新的 toast
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa fa-check-circle" style="color:#10b981;"></i><span>${message}</span>`;
            document.body.appendChild(toast);

            // 自动消失
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, duration);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { hour12: false, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        loadRecordings();
        setInterval(loadRecordings, 5000);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideo(); });
    </script>
</body>
</html>
