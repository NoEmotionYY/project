<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真視眼 CYPHER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1629 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --primary: #00d4ff;
            --success: #34d399;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
            --glass-blur: blur(20px);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-color);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 48px;
            letter-spacing: -0.5px;
        }
        .logo i { 
            color: var(--primary); 
            font-size: 2.5rem;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 24px;
            padding: 48px 56px;
            text-align: center;
            min-width: 460px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        }
        .status {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            transition: all 0.3s ease;
        }
        .status-dot.running { 
            background: var(--success); 
            box-shadow: 0 0 20px var(--success), 0 0 40px rgba(52, 211, 153, 0.4);
        }
        .info {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 28px;
            line-height: 1.7;
        }
        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-start {
            background: linear-gradient(135deg, var(--primary) 0%, #0099cc 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.4);
        }
        .btn-start:hover { 
            background: linear-gradient(135deg, #00e5ff 0%, var(--primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.6);
        }
        .btn-start:active { 
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="logo">
        <i class="fa-solid fa-eye"></i>
        <span>真視眼 CYPHER</span>
    </div>

    <div class="card">
        <div class="status" id="status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">服务未运行</span>
        </div>
        <div class="info" id="info">
            点击"打开服务"启动后端与 nginx 前端部署<br>
            服务启动后将自动进入监控页面
        </div>
        <button class="btn btn-start" id="btn-start" onclick="handleStart()">
            <div class="spinner" id="spinner"></div>
            <i class="fa-solid fa-play" id="btn-icon"></i>
            <span id="btn-text">打开服务</span>
        </button>
    </div>

    <script>
        const btnStart = document.getElementById('btn-start');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const spinner = document.getElementById('spinner');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const info = document.getElementById('info');

        async function handleStart() {
            btnStart.disabled = true;
            btnIcon.style.display = 'none';
            spinner.style.display = 'block';
            btnText.textContent = '启动中...';
            statusText.textContent = '正在启动服务...';

            try {
                const result = await window.electronAPI.startServices();
                if (result.success) {
                    statusDot.classList.add('running');
                    statusText.textContent = '服务运行中';
                    btnText.textContent = '已启动';
                    info.innerHTML = `服务已启动<br>监控页面加载中...`;
                } else {
                    throw new Error(result.error || '启动失败');
                }
            } catch (e) {
                btnStart.disabled = false;
                btnIcon.style.display = 'inline-block';
                spinner.style.display = 'none';
                btnText.textContent = '打开服务';
                statusText.textContent = '启动失败';
                info.textContent = e.message;
            }
        }

        // 监听服务状态推送（启动成功后会收到）
        window.electronAPI.onServiceStatus((status) => {
            if (status.running) {
                statusDot.classList.add('running');
                statusText.textContent = '服务运行中';
            }
        });
    </script>
</body>
</html>
