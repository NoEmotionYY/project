worker_processes  1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # temp paths will be injected by electron-main.js at runtime

    server {
        listen       8443 ssl;
        server_name  localhost;

        ssl_certificate      cert.pem;
        ssl_certificate_key  key.pem;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            root   ../html;
            index  webrtc-client.html;
            try_files $uri $uri/ =404;
        }

        location /monitor {
            alias  ../html/dashboard.html;
            default_type text/html;
        }

        location /test {
            alias  ../html/test-capture.html;
            default_type text/html;
        }

        location /desktop {
            alias  ../html/desktop-capture.html;
            default_type text/html;
        }

        location /recordings {
            alias  ../html/recordings.html;
            default_type text/html;
        }

        # 反向代理：前端同域请求自动转发到 Node.js 后端
        location /events {
            alias  ../html/events.html;
            default_type text/html;
        }

        location /settings {
            alias  ../html/settings.html;
            default_type text/html;
        }

        location /dashboard {
            alias  ../html/dashboard.html;
            default_type text/html;
        }

        location /api/events {
            proxy_pass https://127.0.0.1:8082/api/events;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        location /api/ {
            proxy_pass https://127.0.0.1:8082/api/;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse off;
        }

        location /offer {
            proxy_pass https://127.0.0.1:8082/offer;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_ssl_session_reuse off;
        }
    }
}
